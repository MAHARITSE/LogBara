<!doctype html>
<html lang="fr">
  <head>
    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          var patchTarget = function(obj) {
            try {
              Object.defineProperty(obj, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() { return currentFetch; },
                set: function(fn) { currentFetch = fn; }
              });
            } catch (e) {}
          };
          if (window.Window && window.Window.prototype) {
            patchTarget(window.Window.prototype);
          }
          patchTarget(window);
        } catch (err) {}
      })();
    </script>
